name: master

on:
  workflow_dispatch:

jobs:
  # 소스 코드 변경 사항 확인
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed-files.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=completed&conclusion=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha')
          
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "null" ]; then
            echo ">> 이전 성공 빌드 이력이 없어 직전 커밋(HEAD^)과 비교합니다."
            PREV_SHA="HEAD^"
          else
            echo ">> 이전 성공 배포 커밋: $PREV_SHA"
          fi
          
          if git diff --quiet $PREV_SHA HEAD -- \
            src/main build.gradle Dockerfile manifests/app.yml .github/workflows/deploy.yml; then
            echo ">> 소스 코드 변동 없음 -> 단순 재시작"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo ">> 소스 코드 변동 감지 -> 신규 빌드 및 배포 진행"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # 소스 코드 변경이 있을 때: 1단계 - Gradle 빌드 및 Docker 이미지 푸시 (자동 실행)
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:latest"
          
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  # 소스 코드 변경이 있을 때: 2단계 - 관리자 승인 후 Azure 배포
  deploy:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: scheduler-job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KKAL_KKAL: ${{ secrets.KKAL_KKAL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_TAG="ghcr.io/${REPO_LOWER}:latest"
          export MANAGED_ENV_ID=$(az containerapp env show --name cluster-rest-api --resource-group guney-aks --query id -o tsv)

          envsubst < manifests/app.yml > manifests/app.rendered.yml

          if ! az containerapp show --name scheduler-job --resource-group guney-aks &>/dev/null; then
            echo ">> 신규 Azure Container App 생성: scheduler-job"
            az containerapp create \
              --name scheduler-job \
              --resource-group guney-aks \
              --yaml manifests/app.rendered.yml
          else
            echo ">> 기존 Azure Container App 업데이트 배포: scheduler-job"
            az containerapp update \
              --name scheduler-job \
              --resource-group guney-aks \
              --yaml manifests/app.rendered.yml
          fi

  # 소스 코드 변경이 없을 때: 빌드 건너뛰고 환경변수 갱신 및 즉시 재시작
  restart:
    needs: check
    if: needs.check.outputs.changed == 'false'
    runs-on: ubuntu-latest
    environment: scheduler-job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Azure Container App
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KKAL_KKAL: ${{ secrets.KKAL_KKAL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_TAG="ghcr.io/${REPO_LOWER}:latest"
          export MANAGED_ENV_ID=$(az containerapp env show --name cluster-rest-api --resource-group guney-aks --query id -o tsv)

          envsubst < manifests/app.yml > manifests/app.rendered.yml

          echo ">> 소스 코드 변경 없음: YAML 설정 반영 및 컨테이너 무중단 재시작"
          az containerapp update \
            --name scheduler-job \
            --resource-group guney-aks \
            --yaml manifests/app.rendered.yml

